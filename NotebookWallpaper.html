<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook Goals Wallpaper</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --line-gap: 57px;          /* ~1.5 cm on a standard screen. Change to 38px for 1 cm, 76px for 2 cm */
    --margin-x: 130px;         /* position of the red margin line */
    --ink: #2b3a55;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background-color: #ffffff;
    background-image: linear-gradient(to bottom, transparent calc(var(--line-gap) - 2px), #5b9bd5 calc(var(--line-gap) - 2px), #5b9bd5 var(--line-gap));
    background-size: 100% var(--line-gap);
    font-family: 'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Sans MS', cursive;
    color: var(--ink);
    user-select: none;
  }
  /* single red margin line */
  body::before {
    content: ""; position: fixed; top: 0; bottom: 0; left: var(--margin-x);
    width: 2px; background: #e0454f;
  }

  /* Notes sit on the RIGHT. To move them left, change `justify-content: flex-end` to `flex-start`
     and set padding-left to something bigger than the red line position. */
  #board {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: flex-end;
    gap: clamp(18px, 2vw, 40px);
    padding: 0 clamp(30px, 4vw, 90px);
  }

  .note {
    width: clamp(230px, 17vw, 340px);
    padding: 22px 20px 18px;
    box-shadow: 0 2px 3px rgba(0,0,0,.12), 0 14px 22px -10px rgba(0,0,0,.28);
    position: relative;
  }
  .note::before { /* tape-like top shade */
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 14px;
    background: rgba(255,255,255,.28);
  }
  .note.pink   { background: #ffc2d4; transform: rotate(-2deg); }
  .note.green  { background: #c6efb0; transform: rotate(1.2deg) translateY(18px); }
  .note.yellow { background: #fff09a; transform: rotate(-1deg) translateY(-8px); }

  .title {
    font-size: clamp(20px, 1.5vw, 28px); font-weight: 700; line-height: 1.1;
    margin: 6px 0 4px; outline: none; border-bottom: 2px dashed rgba(43,58,85,.25);
    padding-bottom: 6px; user-select: text; cursor: text; min-height: 1.2em;
  }
  .count { font-size: 14px; opacity: .6; margin: 4px 0 8px; }

  .task { display: flex; align-items: center; gap: 10px; padding: 3px 0; }
  .task input[type=checkbox] {
    appearance: none; -webkit-appearance: none; flex: none;
    width: 22px; height: 22px; margin: 0; cursor: pointer;
    border: 2px solid var(--ink); border-radius: 5px; background: rgba(255,255,255,.55);
    display: grid; place-content: center;
  }
  .task input[type=checkbox]:checked::after {
    content: "\2714"; font-size: 17px; line-height: 1; color: var(--ink);
  }
  .task input[type=text] {
    flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
    font: inherit; font-size: clamp(15px, 1.1vw, 20px); color: var(--ink);
    border-bottom: 1px solid rgba(43,58,85,.18); padding: 2px 0; user-select: text;
  }
  .task input[type=text]::placeholder { color: rgba(43,58,85,.35); }
  .task.done input[type=text] { text-decoration: line-through; opacity: .5; }

  #reset {
    position: fixed; right: 14px; bottom: 10px; font: inherit; font-size: 16px;
    background: rgba(255,255,255,.85); border: 1px solid #aab; border-radius: 6px;
    padding: 2px 10px; cursor: pointer; opacity: .35; color: var(--ink);
  }
  #reset:hover { opacity: 1; }
</style>
</head>
<body>
<div id="board"></div>
<button id="reset" title="Clear every note">clear all</button>

<script>
(function () {
  var KEY = 'notebook-wallpaper-v1';
  var COLORS = ['pink', 'green', 'yellow'];
  var DEFAULT_TITLES = ['Big goals', 'This week', 'Today'];

  function blank() {
    return COLORS.map(function (c, i) {
      return { title: DEFAULT_TITLES[i], tasks: Array.from({ length: 6 }, function () { return { text: '', done: false }; }) };
    });
  }
  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(d) && d.length === 3) return d;
    } catch (e) {}
    return blank();
  }
  var state = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var board = document.getElementById('board');

  function render() {
    board.innerHTML = '';
    state.forEach(function (n, ni) {
      var note = document.createElement('div');
      note.className = 'note ' + COLORS[ni];

      var title = document.createElement('div');
      title.className = 'title'; title.contentEditable = 'true'; title.spellcheck = false;
      title.textContent = n.title;
      title.addEventListener('input', function () { n.title = title.textContent; save(); });
      title.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); title.blur(); } });
      note.appendChild(title);

      var count = document.createElement('div'); count.className = 'count';
      note.appendChild(count);

      function updateCount() {
        var d = n.tasks.filter(function (t) { return t.done; }).length;
        count.textContent = d + ' of 6 done';
      }

      n.tasks.forEach(function (t) {
        var row = document.createElement('label'); row.className = 'task' + (t.done ? ' done' : '');
        var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = t.done;
        var tx = document.createElement('input'); tx.type = 'text'; tx.value = t.text;
        tx.placeholder = 'add a task'; tx.spellcheck = false; tx.maxLength = 60;
        cb.addEventListener('change', function () {
          t.done = cb.checked; row.classList.toggle('done', t.done); updateCount(); save();
        });
        tx.addEventListener('input', function () { t.text = tx.value; save(); });
        tx.addEventListener('click', function (e) { e.preventDefault(); tx.focus(); });
        row.appendChild(cb); row.appendChild(tx); note.appendChild(row);
      });

      updateCount();
      board.appendChild(note);
    });
  }

  document.getElementById('reset').addEventListener('click', function () {
    if (confirm('Clear all three notes?')) { state = blank(); save(); render(); }
  });


  render();
})();
</script>
</body>
</html>
